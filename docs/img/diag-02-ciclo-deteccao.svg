<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760">
  <rect width="760" height="340" fill="#0b1220"/>
  <text x="30" y="48" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700" fill="#e2e8f0">Ciclo de Detecção de Som</text>
  <text x="30" y="76" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#94a3b8">Fluxo do gatilho até o registro no histórico</text>
  <rect x="30" y="92" width="700" height="2" fill="#2b3a52"/><defs><marker id="seta2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
    <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#2dd4bf"/></marker></defs>
    <rect x="110" y="118" width="540" height="60" rx="10" fill="#1e293b" stroke="#0b6ba4" stroke-width="2"/>
    <circle cx="142" cy="148" r="14" fill="#0b6ba4"/>
    <text x="142" y="153" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">1</text>
    <text x="170" y="143" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">1. Usuário toca em "Ouvir ambiente"</text>
    <text x="170" y="163" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">Aciona o botão principal (btn-ouvir)</text><path d="M 380 180 L 380 194" stroke="#2dd4bf" stroke-width="2" marker-end="url(#seta2)"/>
    <rect x="110" y="196" width="540" height="60" rx="10" fill="#1e293b" stroke="#0b6ba4" stroke-width="2"/>
    <circle cx="142" cy="226" r="14" fill="#0b6ba4"/>
    <text x="142" y="231" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">2</text>
    <text x="170" y="221" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">2. Estado: escutando = true</text>
    <text x="170" y="241" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">Animação de ondas + status "Microfone ativo"</text><path d="M 380 258 L 380 272" stroke="#2dd4bf" stroke-width="2" marker-end="url(#seta2)"/>
    <rect x="110" y="274" width="540" height="60" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="142" cy="304" r="14" fill="#f59e0b"/>
    <text x="142" y="309" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">3</text>
    <text x="170" y="299" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">3. Timer aleatório (2–5 s)</text>
    <text x="170" y="319" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">Simula o tempo de análise do ambiente</text><path d="M 380 336 L 380 350" stroke="#2dd4bf" stroke-width="2" marker-end="url(#seta2)"/>
    <rect x="110" y="352" width="540" height="60" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="142" cy="382" r="14" fill="#f59e0b"/>
    <text x="142" y="387" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">4</text>
    <text x="170" y="377" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">4. Sorteio de um som simulado</text>
    <text x="170" y="397" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">6 categorias disponíveis (campainha, buzina, choro…)</text><path d="M 380 414 L 380 428" stroke="#2dd4bf" stroke-width="2" marker-end="url(#seta2)"/>
    <rect x="110" y="430" width="540" height="60" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="142" cy="460" r="14" fill="#2dd4bf"/>
    <text x="142" y="465" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">5</text>
    <text x="170" y="455" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">5. Feedback visual na tela</text>
    <text x="170" y="475" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">Ícone + nome do evento + destino do dispositivo</text><path d="M 380 492 L 380 506" stroke="#2dd4bf" stroke-width="2" marker-end="url(#seta2)"/>
    <rect x="110" y="508" width="540" height="60" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="142" cy="538" r="14" fill="#2dd4bf"/>
    <text x="142" y="543" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">6</text>
    <text x="170" y="533" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">6. Feedback tátil</text>
    <text x="170" y="553" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">navigator.vibrate() com padrão por tipo de som</text><path d="M 380 570 L 380 584" stroke="#2dd4bf" stroke-width="2" marker-end="url(#seta2)"/>
    <rect x="110" y="586" width="540" height="60" rx="10" fill="#1e293b" stroke="#08558a" stroke-width="2"/>
    <circle cx="142" cy="616" r="14" fill="#08558a"/>
    <text x="142" y="621" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">7</text>
    <text x="170" y="611" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">7. Registro no histórico</text>
    <text x="170" y="631" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">localStorage: vibrotatil-historico (máx. 100 itens)</text>
  <path d="M 110 616 L 60 616 L 60 148 L 108 148" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#seta2)"/>
  <text x="20" y="390" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2dd4bf" transform="rotate(-90 20 390)" text-anchor="middle">reincide a cada 5 s enquanto escutando</text>
  <text x="30" y="736" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">Figura 3 — Ciclo do scanner. O passo 4 (sorteio) é o ponto exato a substituir por classificação real via DSP + IA.</text></svg>