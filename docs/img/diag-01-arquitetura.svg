  <text x="716" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">• Classificação por IA</text>
  <text x="716" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">• Bluetooth (BLE)</text>
  <text x="716" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">• Empacotamento nativo</text>
  <text x="716" y="282" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">• Notificações push</text>
