  <text x="30" y="596" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#94a3b8">Figura 2. Camadas do protótipo. A camada de dados simulados é o ponto de substituição pelo motor real de classificação.</text></svg>